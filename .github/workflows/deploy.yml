name: Deploy to server

concurrency:
  group: mycamdesk-server-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 185.112.83.74
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            # Zero-downtime deploy
            DEPLOY_DIR="/opt/site-next"
            LIVE_DIR="/opt/site"
            OLD_DIR="/opt/site-old"
            ENV_FILE="/opt/env.production"

            # 0. Ensure env file exists in safe location
            if [ ! -f "$ENV_FILE" ]; then
              cp "$LIVE_DIR/.env.local" "$ENV_FILE" 2>/dev/null || true
            fi

            # 1. Clone fresh
            rm -rf "$DEPLOY_DIR"
            git clone --depth 1 https://github.com/znt7cwdygc-crypto/Journal.git "$DEPLOY_DIR"
            cp "$ENV_FILE" "$DEPLOY_DIR/.env.local"
            sed -i '/^DEPLOY_ENV=/d' "$DEPLOY_DIR/.env.local"
            echo 'DEPLOY_ENV=production' >> "$DEPLOY_DIR/.env.local"
            chmod 600 "$DEPLOY_DIR/.env.local"

            # 2. Build (site stays live)
            cd "$DEPLOY_DIR"
            npm ci
            npx prisma generate
            npm run check:security
            npm run check:article-html
            npm run content:low-demand:validate
            npm run build
            DB_VAL=$(grep -E '^DATABASE_URL=' .env.local | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')
            DATABASE_URL="$DB_VAL" npx prisma db push 2>&1 | tail -1
            CONTENT_MARKER="/opt/content-updates/low-demand-v1.done"
            if [ ! -f "$CONTENT_MARKER" ]; then
              mkdir -p /opt/content-updates /opt/content-backups
              DATABASE_URL="$DB_VAL" CONTENT_UPDATE_CONFIRM=low-demand-v1 CONTENT_BACKUP_DIR=/opt/content-backups npx tsx prisma/update-low-demand-content.ts --apply
              touch "$CONTENT_MARKER"
            fi
            unset DB_VAL
            cp -r .next/static /var/www/static/_next/

            # 3. Swap instantly
            rm -rf "$OLD_DIR"
            mv "$LIVE_DIR" "$OLD_DIR"
            mv "$DEPLOY_DIR" "$LIVE_DIR"

            # 4. Restart PM2
            cd "$LIVE_DIR"
            pm2 delete site 2>/dev/null || true
            NODE_ENV=production PORT=3000 pm2 start node --name site -- node_modules/.bin/next start -p 3000
            pm2 save

            # 5. Cleanup
            rm -rf "$OLD_DIR"
            echo "Production deploy done: $(date)"

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dev via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 185.112.83.74
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            DEPLOY_DIR="/opt/site-dev-next"
            LIVE_DIR="/opt/site-dev"
            OLD_DIR="/opt/site-dev-old"
            ENV_FILE="/opt/env.dev"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing $ENV_FILE; refusing to use production environment for dev"
              exit 1
            fi

            rm -rf "$DEPLOY_DIR"
            git clone --depth 1 --branch dev https://github.com/znt7cwdygc-crypto/Journal.git "$DEPLOY_DIR"
            cp "$ENV_FILE" "$DEPLOY_DIR/.env.local"
            sed -i '/^DEPLOY_ENV=/d' "$DEPLOY_DIR/.env.local"
            echo 'DEPLOY_ENV=dev' >> "$DEPLOY_DIR/.env.local"
            chmod 600 "$DEPLOY_DIR/.env.local"

            cd "$DEPLOY_DIR"
            npm ci
            npx prisma generate
            npm run check:security
            npm run check:article-html
            npm run content:low-demand:validate
            npm run build
            DB_VAL=$(grep -E '^DATABASE_URL=' .env.local | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')
            DATABASE_URL="$DB_VAL" npx prisma db push 2>&1 | tail -1
            CONTENT_MARKER="/opt/content-updates/low-demand-v1.done"
            if [ ! -f "$CONTENT_MARKER" ]; then
              mkdir -p /opt/content-updates /opt/content-backups
              DATABASE_URL="$DB_VAL" CONTENT_UPDATE_CONFIRM=low-demand-v1 CONTENT_BACKUP_DIR=/opt/content-backups npx tsx prisma/update-low-demand-content.ts --apply
              touch "$CONTENT_MARKER"
            fi
            unset DB_VAL

            rm -rf "$OLD_DIR"
            mv "$LIVE_DIR" "$OLD_DIR"
            mv "$DEPLOY_DIR" "$LIVE_DIR"

            cd "$LIVE_DIR"
            pm2 delete site-dev 2>/dev/null || true
            NODE_ENV=production PORT=3001 pm2 start node --name site-dev -- node_modules/.bin/next start -p 3001
            pm2 save
            rm -rf "$OLD_DIR"
            echo "Dev deploy done: $(date)"
